- name: Update file
  run: |
    echo "Last update: $(date)" > log.txt

- name: Commit & Push
  run: |
    git config user.name "github-actions[bot]"
    git config user.email "github-actions[bot]@users.noreply.github.com"
    git add log.txt
    git commit -m "auto commit: update $(date)"
    git push
