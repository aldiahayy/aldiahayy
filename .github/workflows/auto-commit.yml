name: Auto Commit Daily

on:
  schedule:
    - cron: "0 0 * * *"   # tiap hari (UTC)
  workflow_dispatch:       # bisa manual juga

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update file
        run: |
          echo "Last update: $(date)" >> log.txt

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "auto commit: update $(date)" || echo "No changes"
          git push
